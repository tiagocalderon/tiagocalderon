name: Metrics

on:
  # Se regenera todos los días a las 03:00 UTC (medianoche en Buenos Aires)
  schedule: [{ cron: "0 3 * * *" }]
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          debug: yes
          user: tiagocalderon
          token: ${{ secrets.METRICS_TOKEN }}
          # El commit lo hace GITHUB_TOKEN para no re-disparar workflows
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg

          # ---- Base ----
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Argentina/Buenos_Aires
          commits_authoring: tiagocalderon, tiagocalderon8@gmail.com

          # ---- Lenguajes más usados ----
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook, tex
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          # ---- Calendario de contribuciones (reemplaza al streak card) ----
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ---- Hábitos de codificación ----
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 7
          plugin_habits_facts: yes
          plugin_habits_charts: yes
